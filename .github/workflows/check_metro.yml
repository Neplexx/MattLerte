name: Vérification Métro & Tram Ilévia

on:
  # Déclenché toutes les 5 min par cron-job.org (et manuellement depuis l'onglet Actions)
  workflow_dispatch:

jobs:
  check-ilevia:
    runs-on: ubuntu-24.04
    timeout-minutes: 2

    steps:
      - name: Récupération du dépôt
        uses: actions/checkout@v7

      - name: Installation de uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Installation des dépendances Python
        run: uv sync --frozen --no-dev

      - name: Exécution de MattLerte
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
        run: uv run mattlerte
