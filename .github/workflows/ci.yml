name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Récupération du dépôt
        uses: actions/checkout@v4

      - name: Installation de uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Installation des dépendances Python
        run: uv sync --frozen

      - name: Exécution des tests
        run: uv run pytest -v
